seed: 42

data:
  root: "data"
  image_dir: "images"
  mask_dir: "masks"
  train_split: "splits/train.txt"
  val_split: "splits/val.txt"
  tile_size: 512
  num_classes: 4
  class_names: ["parcel_border", "building", "hard_surface", "tree"]

model:
  arch: "Unet"          # smp.Unet | smp.UnetPlusPlus (fallback for tree channel)
  encoder: "resnet34"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 4

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  # inverse-frequency pos_weight per channel for BCE (neg/pos), computed from
  # the 26 train base tiles of the fold-1 trial set (downscaled 512px):
  #   parcel_border 1.83% px -> 53.665   building     11.03% px -> 8.066
  #   hard_surface  4.15% px -> 23.079   tree          3.03% px -> 32.022
  # Recompute if the dataset changes.
  pos_weight: [53.665, 8.066, 23.079, 32.022]

train:
  batch_size: 8
  epochs: 60
  lr: 3.0e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"
  scheduler: "cosine"
  early_stopping_patience: 10
  num_workers: 2
  device: "cuda"

augmentation:
  # Dihedral-8 (flips + 90° rotations) is applied OFFLINE when building the
  # dataset (each train tile is materialized in all 8 orientations), so the
  # online geometric transforms below are disabled to avoid stacking. Only
  # the non-dihedral photometric/elastic transforms run online.
  hflip: 0.0
  vflip: 0.0
  rotate90: false
  elastic_deform: 0.2      # apply to image+mask jointly
  color_jitter: 0.2

checkpoint:
  dir: "checkpoints"
  save_best_metric: "mean_iou"
